name: StoneMaster Engine Tests

on:
  push:
    branches: [main, industrial-redesign]
  pull_request:
    branches: [main]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r engine/requirements.txt
      - name: Run tests
        working-directory: engine
        env:
          PYTHONPATH: .
        run: python -m pytest -q
